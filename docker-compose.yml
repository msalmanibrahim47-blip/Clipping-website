# Local infrastructure: Postgres + MinIO (S3-compatible) + the processing worker.
# Run the web app with `npm run dev:web` against it (see README → Local setup).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: longcut
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/longcut;
      mc ilm rule add --expire-delete-marker --noncurrent-expire-days 1 local/longcut || true;
      exit 0"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/longcut
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_BUCKET: longcut
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: "true"
      RUN_MIGRATIONS: "true"
    volumes: [workertmp:/data]

volumes:
  pgdata:
  miniodata:
  workertmp:
